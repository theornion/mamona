<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wybór tematów — QA</title><link rel="stylesheet" href="../assets/css/main.css"><link rel="stylesheet" href="../assets/css/admin.css"></head><body class="admin-page admin-page-topics"><main class="admin-main"><section class="post admin-card technical-sources-page"><h1>Tematy redakcyjne</h1><form class="topic-bulk-toolbar" onsubmit="return false"><div class="topic-bulk-select"><label><input id="topic-select-visible" type="checkbox"> Zaznacz wszystkie widoczne</label><button id="topic-select-top" type="button">Zaznacz 10</button><button id="topic-clear-selection" type="button">Wyczyść wybór</button><strong class="topic-selected-counter" aria-live="polite">Zaznaczono: <span id="topic-selected-count">0</span></strong></div><div class="topic-action-toolbar"><button disabled>Research</button><button disabled>QC</button><button disabled>Grafiki</button></div></form><div class="technical-source-list topic-control-list" id="cards"></div></section></main><script>
const list=document.querySelector('#cards');for(let i=0;i<6;i++){const id=241-i;list.insertAdjacentHTML('beforeend',`<article class="technical-source-card topic-control-card" data-topic-id="${id}" data-selected="false"><header><div><div class="topic-card-selector"><label class="topic-checkbox-hitbox" for="topic-check-${id}"><input class="topic-checkbox" id="topic-check-${id}" type="checkbox" value="${id}" aria-labelledby="topic-title-${id}"><span class="visually-hidden">Zaznacz temat</span></label><span class="topic-selected-badge" aria-hidden="true">✓ Zaznaczony</span><span class="editorial-status">2 wpisy / 2 źródła</span></div><h3 id="topic-title-${id}">#${id} — Temat redakcyjny ${id}</h3></div><a class="button admin-preview-action" href="#preview-${id}">Podgląd</a></header><p><strong>Wynik: ${96-i}/100</strong> · ryzyko: niskie</p><div class="topic-card-actions"><button>Research</button><button>QC</button><button>Grafiki</button></div><details><summary>Źródła i szczegóły</summary><p>Treść szczegółów.</p></details><button class="topic-trash" type="button" aria-label="Kosz">🗑</button></article>`)}
const boxes=[...document.querySelectorAll('.topic-checkbox')],count=document.querySelector('#topic-selected-count');function sync(){const n=boxes.filter(x=>x.checked).length;count.textContent=n;boxes.forEach(x=>{const c=x.closest('.topic-control-card');c.classList.toggle('is-selected',x.checked);c.dataset.selected=String(x.checked)});document.querySelectorAll('.topic-action-toolbar button').forEach(x=>x.disabled=!n)}boxes.forEach(x=>x.addEventListener('change',sync));document.querySelector('#topic-select-visible').addEventListener('change',e=>{boxes.forEach(x=>x.checked=e.target.checked);sync()});document.querySelector('#topic-select-top').addEventListener('click',()=>{boxes.forEach((x,i)=>x.checked=i<10);sync()});document.querySelector('#topic-clear-selection').addEventListener('click',()=>{boxes.forEach(x=>x.checked=false);sync()});
</script></body></html>
